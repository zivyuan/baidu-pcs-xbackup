auth: oauth                       # oauth = 开放平台(需企业 AppKey)| web = 网页版 BDUSS(个人账号)
app_key: "你的AppKey"             # auth: oauth 时必填
secret_key: "你的SecretKey"
app_name: "项目数据备份"           # 备份根目录名(建在网盘根下);留空 = /apps
access_token_file: "~/.bpxup/token.json"   # oauth 模式凭证文件
bduss_file: "~/.bpxup/bduss.json"          # web 模式 BDUSS 凭证文件
remote_root: ""                   # 显式指定备份根目录时优先于 app_name,一般留空即可
log_file: ""                      # daemon 模式默认 ./bpxup.log
projects:
  - id: davidoff                  # 项目 id/任务名支持中文、空格等网盘合法目录名,规则相同
    tasks:
      - name: realdata
        source: /data/realdata
        mode: archive             # archive = tar.gz | raw = 原样递归
        retention: 7
        daily_at: "03:00"
