app_key: "你的AppKey"
secret_key: "你的SecretKey"
app_name: "项目数据备份"           # 备份根目录名(建在网盘根下);留空 = /apps
access_token_file: "~/.bpxup/token.json"
remote_root: ""                   # 显式指定备份根目录时优先于 app_name,一般留空即可
log_file: ""                      # daemon 模式默认 ./bpxup.log
webhook_url: ""                   # 企业微信机器人 webhook;留空 = 不通知
retry:
  max_attempts: 3                 # 总尝试次数(含首次),重试耗尽后终止任务待人工干预
  interval: 30s                   # run 模式重试间隔
  daemon_interval: 10m            # daemon 模式重试间隔
projects:
  - id: davidoff                  # 项目 id/任务名支持中文、空格等网盘合法目录名,规则相同
    tasks:
      - name: realdata
        source: /data/realdata
        mode: archive             # archive = tar.gz | raw = 原样递归
        retention: 7
        daily_at: "03:00"
