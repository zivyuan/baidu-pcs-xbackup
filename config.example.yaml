app_key: "你的AppKey"
secret_key: "你的SecretKey"
access_token_file: "~/.bbs/token.json"
remote_root: ""                   # 留空 = 网盘根目录(项目目录直接建在根下);也可填如 /备份
log_file: ""                      # daemon 模式默认 ./bbs.log
projects:
  - id: davidoff                  # 项目 id/任务名支持中文、空格等网盘合法目录名,规则相同
    description: "Davidoff 项目数据备份"  # 可选,写入项目目录 README.md
    tasks:
      - name: realdata
        source: /data/realdata
        mode: archive             # archive = tar.gz | raw = 原样递归
        retention: 7
        daily_at: "03:00"
